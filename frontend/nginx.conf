server {
  listen 80;
  
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
 
  # Proxy hacia el servicio interno backend_api en la red de Docker
  location /api/ {
    proxy_pass http://backend_api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
