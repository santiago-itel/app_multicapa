name: CI/CD - Microservicios Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [ backend, frontend ]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      
      - name: Validar docker-compose.yml
        run: docker compose config -q
      
      # GHCR exige nombres de imagen en minúsculas
      - name: Definir nombre de imagen
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
 
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.servicio }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.servicio }}:${{ github.com }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Desplegar en la VM por SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 600 /dev/null key
          echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd ~/app-multicapa && git pull && docker compose up -d --build"
